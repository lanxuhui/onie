# Accton cx864e_n ONIE installer configuration

description="Asterfusion, cx864e_n"

mass_dev="storage-not-found"
discover_mass_storage()
{
    mass_bus="$1"
    for i in a b c d e ; do
        if $(ls -l /sys/block/sda/device 2>/dev/null | grep -q "$mass_bus") ; then
            mass_dev="/dev/sd$i"
            return 0
        fi
    done
    return 1
}

# Default ONIE block device
# 0:0:0 means d1508 or d1527
# 4:0:0 means c3000
# 1:0:0 means d1712
install_device_platform()
{
    discover_mass_storage "target1:0:0"  ||
    discover_mass_storage "0000:00:0e.0"
    ret=$?
    echo "$mass_dev"
    return $ret
}

